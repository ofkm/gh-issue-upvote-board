<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Config.SiteTitle}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/markdown-styles.css">
    <style>
        :root {
            --primary: {{.Config.PrimaryColor}};
            --secondary: {{.Config.SecondaryColor}};
        }
    </style>
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-main">
                <div class="header-brand">
                    <h1>{{.Config.SiteTitle}}</h1>
                    <a href="{{.Config.RepoURL}}" target="_blank" class="header-repo-link" aria-label="View Repository">
                        <i data-lucide="github"></i>
                        <span>{{.Config.Owner}}/{{.Config.Repo}}</span>
                    </a>
                </div>
                <div class="header-actions">
                     <button id="theme-toggle" class="theme-toggle icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">
                        <i class="sun-icon" data-lucide="sun"></i>
                        <i class="moon-icon" data-lucide="moon"></i>
                    </button>
                    <button class="icon-btn" onclick="openSettings()" aria-label="Settings">
                        <i data-lucide="settings"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="filter-bar">
            <!-- Filter form with hidden inputs for active filters -->
            <form id="filter-form" class="filter-form">
                <input type="hidden" id="active-owner" name="owner" value="{{.Config.Owner}}">
                <input type="hidden" id="active-repo" name="repo" value="{{.Config.Repo}}">
                <input type="hidden" id="active-label" name="label" value="{{.Config.Label}}">
                <input type="hidden" id="active-milestone-only" name="milestone_only" value="false">
                <input type="hidden" id="active-pr-only" name="pr_only" value="false">
                
                <div class="filter-shell">
                    <div class="quick-filters" aria-label="Quick issue filters">
                        <button type="button" class="filter-chip" data-label-filter="" onclick="setLabelFilter('')">
                            <i data-lucide="layers-3"></i>
                            <span>All</span>
                        </button>
                        <button type="button" class="filter-chip" data-label-filter="feature" onclick="setLabelFilter('feature')">
                            <i data-lucide="sparkles"></i>
                            <span>Feature</span>
                        </button>
                        <button type="button" class="filter-chip" data-label-filter="bug" onclick="setLabelFilter('bug')">
                            <i data-lucide="bug"></i>
                            <span>Bug</span>
                        </button>
                        <button type="button" class="filter-chip filter-chip-toggle" data-toggle-filter="milestone" onclick="toggleQuickFilter('milestone')">
                            <i data-lucide="flag"></i>
                            <span>Milestone</span>
                        </button>
                        <button type="button" class="filter-chip filter-chip-toggle" data-toggle-filter="pr" onclick="toggleQuickFilter('pr')">
                            <i data-lucide="git-pull-request"></i>
                            <span>Open PR</span>
                        </button>
                    </div>

                    <div class="filter-group filter-group-state">
                        <select id="state" name="state" 
                                hx-get="/issues" 
                                hx-target="#issue-container" 
                                hx-include="#filter-form" 
                                hx-indicator="#loading">
                            <option value="open" {{if eq .Config.State "open"}}selected{{end}}>Open Issues</option>
                            <option value="closed" {{if eq .Config.State "closed"}}selected{{end}}>Closed Issues</option>
                            <option value="all" {{if eq .Config.State "all"}}selected{{end}}>All Issues</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <div id="loading" class="loading htmx-indicator">
            <div class="spinner"></div>
            <span>Loading issues...</span>
        </div>

        <div id="issue-container" 
             hx-get="/issues" 
             hx-trigger="load"
             hx-indicator="#loading">
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal" onclick="if(event.target === this) closeSettings()">
        <div class="modal-dialog settings-dialog">
            <div class="modal-header">
                <h3>Configuration</h3>
                <button class="modal-close-btn-static" onclick="closeSettings()"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="setting-owner">Owner</label>
                    <input type="text" id="setting-owner" class="form-control" placeholder="github-owner">
                </div>
                <div class="form-group">
                    <label for="setting-repo">Repository</label>
                    <input type="text" id="setting-repo" class="form-control" placeholder="repository-name">
                </div>
                <div class="form-group">
                    <label for="setting-label">Filter Label</label>
                    <input type="text" id="setting-label" class="form-control" placeholder="e.g. feature, bug, enhancement">
                    <small class="form-hint">Quick filters can override this with glassy enthusiasm</small>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-primary" onclick="searchIssues()">Apply Changes</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // Settings Modal Functions
        function openSettings() {
            // Populate modal with current active values
            document.getElementById('setting-owner').value = document.getElementById('active-owner').value;
            document.getElementById('setting-repo').value = document.getElementById('active-repo').value;
            document.getElementById('setting-label').value = document.getElementById('active-label').value;
            
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function searchIssues() {
            // Update active values
            document.getElementById('active-owner').value = document.getElementById('setting-owner').value;
            document.getElementById('active-repo').value = document.getElementById('setting-repo').value;
            document.getElementById('active-label').value = document.getElementById('setting-label').value;
            
            closeSettings();
            syncQuickFilters();
            
            // Trigger refresh
            refreshIssues();
        }

        function refreshIssues() {
            const stateSelect = document.getElementById('state');
            htmx.trigger(stateSelect, 'change');
        }

        function setLabelFilter(label) {
            document.getElementById('active-label').value = label;
            syncQuickFilters();
            refreshIssues();
        }

        function toggleQuickFilter(filterName) {
            const input = document.getElementById(`active-${filterName}-only`);
            input.value = input.value === 'true' ? 'false' : 'true';
            syncQuickFilters();
            refreshIssues();
        }

        function syncQuickFilters() {
            const activeLabel = document.getElementById('active-label').value.trim().toLowerCase();
            const milestoneOnly = document.getElementById('active-milestone-only').value === 'true';
            const prOnly = document.getElementById('active-pr-only').value === 'true';

            document.querySelectorAll('[data-label-filter]').forEach((button) => {
                const buttonLabel = button.dataset.labelFilter.trim().toLowerCase();
                const isAll = buttonLabel === '';
                button.classList.toggle('active', isAll ? activeLabel === '' : activeLabel === buttonLabel);
            });

            const milestoneButton = document.querySelector('[data-toggle-filter="milestone"]');
            const prButton = document.querySelector('[data-toggle-filter="pr"]');
            if (milestoneButton) milestoneButton.classList.toggle('active', milestoneOnly);
            if (prButton) prButton.classList.toggle('active', prOnly);
        }
        
        // Initialize theme from localStorage or system preference
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }

            syncQuickFilters();
        })();
    </script>
</body>
</html>
