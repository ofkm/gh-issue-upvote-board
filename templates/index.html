<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Config.SiteTitle}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/markdown-styles.css">
    <style>
        :root {
            --primary: {{.Config.PrimaryColor}};
            --secondary: {{.Config.SecondaryColor}};
        }
    </style>
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-main">
                <div class="header-brand">
                    <h1>{{.Config.SiteTitle}}</h1>
                    <a href="{{.Config.RepoURL}}" target="_blank" class="header-repo-link" aria-label="View Repository">
                        <i data-lucide="github"></i>
                        <span>{{.Config.Owner}}/{{.Config.Repo}}</span>
                    </a>
                </div>
                <div class="header-actions">
                     <button id="theme-toggle" class="theme-toggle icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">
                        <i class="sun-icon" data-lucide="sun"></i>
                        <i class="moon-icon" data-lucide="moon"></i>
                    </button>
                    <button class="icon-btn" onclick="openSettings()" aria-label="Settings">
                        <i data-lucide="settings"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="filter-bar">
            <!-- Filter form with hidden inputs for active filters -->
            <form id="filter-form" class="filter-form">
                <input type="hidden" id="active-owner" name="owner" value="{{.Config.Owner}}">
                <input type="hidden" id="active-repo" name="repo" value="{{.Config.Repo}}">
                <input type="hidden" id="active-label" name="label" value="{{.Config.Label}}">
                
                <div class="filter-group">
                    <select id="state" name="state" 
                            hx-get="/issues" 
                            hx-target="#issue-container" 
                            hx-include="#filter-form" 
                            hx-indicator="#loading">
                        <option value="open" {{if eq .Config.State "open"}}selected{{end}}>Open Issues</option>
                        <option value="closed" {{if eq .Config.State "closed"}}selected{{end}}>Closed Issues</option>
                        <option value="all" {{if eq .Config.State "all"}}selected{{end}}>All Issues</option>
                    </select>
                </div>
            </form>
        </div>

        <div id="loading" class="loading htmx-indicator">
            <div class="spinner"></div>
        </div>

        <div id="issue-container" 
             hx-get="/issues" 
             hx-trigger="load"
             hx-indicator="#loading">
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal" onclick="if(event.target === this) closeSettings()">
        <div class="modal-dialog settings-dialog">
            <div class="modal-header">
                <h3>Configuration</h3>
                <button class="modal-close-btn-static" onclick="closeSettings()"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="setting-owner">Owner</label>
                    <input type="text" id="setting-owner" class="form-control" placeholder="github-owner">
                </div>
                <div class="form-group">
                    <label for="setting-repo">Repository</label>
                    <input type="text" id="setting-repo" class="form-control" placeholder="repository-name">
                </div>
                <div class="form-group">
                    <label for="setting-label">Filter Label</label>
                    <input type="text" id="setting-label" class="form-control" placeholder="e.g. feature-request">
                    <small class="form-hint">Leave empty to show all issues</small>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-primary" onclick="searchIssues()">Apply Changes</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // Settings Modal Functions
        function openSettings() {
            // Populate modal with current active values
            document.getElementById('setting-owner').value = document.getElementById('active-owner').value;
            document.getElementById('setting-repo').value = document.getElementById('active-repo').value;
            document.getElementById('setting-label').value = document.getElementById('active-label').value;
            
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function searchIssues() {
            // Update active values
            document.getElementById('active-owner').value = document.getElementById('setting-owner').value;
            document.getElementById('active-repo').value = document.getElementById('setting-repo').value;
            document.getElementById('active-label').value = document.getElementById('setting-label').value;
            
            closeSettings();
            
            // Trigger refresh
            const stateSelect = document.getElementById('state');
            htmx.trigger(stateSelect, 'change');
        }
        
        // Initialize theme from localStorage or system preference
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</body>
</html>
