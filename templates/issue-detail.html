<div class="issue-detail-view">
  <div class="detail-header">
    <div class="detail-meta-top">
      <span class="detail-id">#{{.Issue.Number}}</span>
      <span class="detail-date">{{.Issue.CreatedAt.Format "Jan 02, 2006"}}</span>
    </div>
    <h2 class="detail-title">{{.Issue.Title}}</h2>

    <div class="detail-author-row">
      <div class="author-info">
        <img src="{{.Issue.User.AvatarURL}}" alt="" class="avatar-small" />
        <span class="author-name">{{.Issue.User.Login}}</span>
      </div>
      <div class="detail-state">
        <span class="state-dot state-{{.Issue.State}}"></span>
        {{.Issue.State}}
      </div>
    </div>
  </div>

  <div class="detail-content markdown-body">
    {{if .Issue.Body}} {{markdown .Issue.Body}} {{else}}
    <p class="empty-text">No description provided.</p>
    {{end}}
  </div>

  <div class="detail-footer">
    <div class="vote-stat">
      <i data-lucide="thumbs-up"></i>
      <span>{{.Issue.Reactions.PlusOne}}</span>
    </div>

    <div class="detail-actions">
      <a href="{{.Issue.HTMLURL}}" target="_blank" class="action-btn primary">
        View on GitHub <i data-lucide="external-link" class="icon-sm"></i>
      </a>
    </div>
  </div>
</div>
